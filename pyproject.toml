[project]
name = "latent_reasoning"
version = "0.0.1"
description = "Code for the two-hop latent reasoning paper."
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
    "accelerate==1.14.0",
    "anthropic==0.109.2",
    "deepspeed==0.19.2",
    "devtools==0.12.2",
    "fire==0.7.1",
    "geonamescache",
    "langchain-anthropic==1.4.6",
    "langchain-community==0.4.2",
    "langchain-core==1.4.7",
    "langchain-openai==1.3.2",
    "langchain==1.3.9",
    "tokenizers==0.22.2",
    "torch==2.13.0",
    "transformers==5.12.1",
    "trl==0.19.1",
    "wandb==0.27.2",
    "litellm==1.89.2",
    "pydantic",
    "tqdm==4.68.3",
    "pytest==9.1.0",
    "ipykernel",
    "inspect-ai==0.3.265",
    "peft==0.19.1",
    "protobuf>=7.35.1",
    "starlette>=1.3.1",
]

[project.optional-dependencies]
dev = [
    "ruff",
    "pyright",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=83.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["latent_reasoning"]

[tool.ruff]
line-length = 100
fix = true

[tool.ruff.lint]
select = [
    # pycodestyle
    "E",
    # Pyflakes
    "F",
    # pyupgrade
    "UP",
    # flake8-bugbear
    "B",
    # flake8-simplify
    "SIM",
    # isort
    "I",
]

[tool.ruff.format]
# Enable reformatting of code snippets in docstrings.
docstring-code-format = true

[tool.ruff.isort]
known-third-party = ["wandb"]

[tool.pyright]
include = ["latent_reasoning", "tests"]

strictListInference = true
strictDictionaryInference = true
strictSetInference = true
reportFunctionMemberAccess = true
reportUnknownParameterType = true
reportIncompatibleMethodOverride = true
reportIncompatibleVariableOverride = true
reportInconsistentConstructorType = true
reportOverlappingOverload = true
reportConstantRedefinition = true
reportImportCycles = true
reportPropertyTypeMismatch = true
reportMissingTypeArgument = true
reportUnnecessaryCast = true
reportUnnecessaryComparison = true
reportUnnecessaryContains = true
reportUnusedExpression = true
reportMatchNotExhaustive = true
reportShadowedImports = true
reportPrivateImportUsage = false
